<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1d6762" />
  <meta name="description" content="《留名罐》——浏览器原生民俗调查解谜。" />
  <title>留名罐</title>
  <link rel="icon" href="assets/icons/computer.png" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div id="boot" class="boot" aria-live="polite">
    <div class="boot-room" id="bootRoom">
      <div class="boot-copy" id="bootCopy">
        <p>头七过了，我回来收屋。</p>
        <p>门一推开，樟脑丸味还是那么冲。</p>
        <button id="bootContinue" class="quiet-button">继续</button>
      </div>
    </div>
  </div>

  <main id="desktop" class="desktop hidden" aria-label="林守义的旧电脑桌面">
    <div class="desktop-grain" aria-hidden="true"></div>
    <div id="desktopIcons" class="desktop-icons"></div>
    <section id="windowLayer" class="window-layer" aria-live="polite"></section>
    <div id="toastLayer" class="toast-layer" aria-live="polite"></div>
    <div id="phoneLayer" class="phone-layer hidden"></div>
    <div id="crtWarp" class="crt-warp" aria-hidden="true"></div>
    <div id="contextMenu" class="context-menu hidden" role="menu"></div>

    <footer class="taskbar">
      <button id="startButton" class="start-button"><img src="assets/icons/computer.png" alt=""/>开始</button>
      <div id="taskButtons" class="task-buttons"></div>
      <div class="task-status"><span id="taskHint">系统就绪</span></div>
      <button id="soundButton" class="sound-button" title="环境与设备声音">声音：开</button><button id="clockButton" class="clock-button" title="双击查看系统时间"><span id="clockText">21:17</span></button>
    </footer>
  </main>

  <div id="endingLayer" class="ending-layer hidden" aria-live="polite"></div>
  <noscript>本作需要 JavaScript 才能运行。</noscript>
  <script src="assets/app.js"></script>
</body>
</html>
