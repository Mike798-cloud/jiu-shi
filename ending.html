<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>留名罐｜留名罐</title><link rel="stylesheet" href="assets/story.css"></head><body data-page="ending"><div class="story-shell theme-end"><div class="topline"><b>林家老屋 · 天快亮了</b><span class="stage-tag">最后一页</span></div><main class="page"><div class="ending-table"><section class="ending-note"><p>我那天站在路口另一头，没看见他什么时候走过去。</p><p>后来我总想，是不是我把活孩子的队伍当成了能借的东西。</p><p>这事没有谁能替我证明。也没有谁能替那个娃把名字补上。</p><p>杨元成把罐子照片寄回来以后，我在底下刻了两个字。刻得很难看。</p><p>禾穗。</p></section><div class="name-slip"><div class="old">未知男童 / 第七人</div><div class="final-name" data-name></div><button class="write-name" data-write>把名字写上去</button></div></div></main><div class="end-black" data-black></div></div><script src="assets/story.js"></script></body></html>
